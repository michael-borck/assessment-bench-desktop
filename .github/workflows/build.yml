# Shared Electron release pipeline: michael-borck/app-hq/.github/workflows/electron-release.yml
name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: michael-borck/app-hq/.github/workflows/electron-release.yml@main
    with:
      product-name: Assessment Bench
      node-version: '22'
      preflight-command: npm run typecheck && npm test
      package-command: npx electron-builder --$PLATFORM --config electron-builder.config.js --publish always
      notarize-check-command: npx electron-builder --mac zip --arm64 --config electron-builder.config.js --publish never
      notarize-check-artifact-root: release
      publish-mode: builder
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
